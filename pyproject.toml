[project]
name = "catdog"
version = "1.0.0"
description = "Cat vs dog image classifier: a pretrained ResNet-18 fine-tuned on the Oxford-IIIT Pet dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.scripts]
catdog = "catdog.cli:main"

[dependency-groups]
tools = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]
dev = [{ include-group = "tools" }]
# The tools plus CPU-only PyTorch wheels, for CI: `uv sync --no-dev --group cpu`. The default
# install (the dev group) uses PyPI's wheels, which include CUDA on Linux (a multi-GB download)
# and MPS on macOS; declaring cpu and dev as conflicting keeps the two torch builds apart.
cpu = [
    { include-group = "tools" },
    "torch",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "dev" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }]
torchvision = [{ index = "pytorch-cpu", group = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
