[project]
name = "catdog"
version = "1.0.0"
description = "Cat vs dog image classifier: a pretrained ResNet-18 fine-tuned on the Oxford-IIIT Pet dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.scripts]
catdog = "catdog.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

# Linux (CI) gets the CPU-only PyTorch wheels instead of the multi-GB CUDA build.
# macOS uses the regular PyPI wheels, which include Apple MPS support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
